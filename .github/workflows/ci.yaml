name: CI
on:
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
  pull_request:
    paths-ignore:
      - "**.md"
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  CARGO_INCREMENTAL: 0
defaults:
  run:
    working-directory: krnl
jobs:
  test:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          path: krnl
      - uses: actions/checkout@v4
        with:
          repository: jlogan03/rust-gpu
          ref: jlogan/consistent-floats
          path: rust-gpu
      - name: install toolchains
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rust-docs --no-self-update
          rustup toolchain install nightly --component miri --no-self-update
          rustup toolchain install nightly-2026-05-22 --component rust-src,rustc-dev,llvm-tools --no-self-update
      - name: build
        run: cargo build --workspace --features serde --all-targets -v
      - name: test
        run: |
          cargo test --workspace --no-default-features --features serde -v
          cargo test -p compute-benches --benches --no-default-features -v
      - name: miri test
        run: |
          cargo update half@2 --precise 2.2.0 # miri doesn't support asm!
          cargo +nightly miri test --tests --no-default-features --features serde -v
          cargo update half@2
      - name: install wasm-pack
        run: cargo install wasm-pack -vv
      - name: wasm test safari
        if: ${{ runner.os == 'macOS' }}
        run: wasm-pack test --headless --safari -- --no-default-features --features serde -vv
        env:
          RUSTFLAGS: --cfg run_in_browser
      - name: wasm test
        run: wasm-pack test --headless --firefox -- --no-default-features --features serde -vv
        env:
          RUSTFLAGS: --cfg run_in_browser
        continue-on-error: ${{ runner.os == 'macOS' }}
  krnlc:
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          # - os: windows-latest
          #   target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: x86_64-apple-darwin
    steps:
      - uses: actions/checkout@v4
        with:
          path: krnl
      - uses: actions/checkout@v4
        with:
          repository: jlogan03/rust-gpu
          ref: jlogan/consistent-floats
          path: rust-gpu
      - name: install toolchains
        run: |
          rustup set profile minimal
          rustup toolchain install stable nightly --no-self-update
          rustup toolchain install nightly-2026-05-22 --component rust-src,rustc-dev,llvm-tools --no-self-update
      - name: check krnlc
        run: cargo +nightly-2026-05-22 -Zunstable-options -C=krnlc check --locked -vv
      - name: install krnlc
        run: cargo +nightly-2026-05-22 install --path krnlc --root . --locked -vv --debug
      - name: krnlc check
        run: ./bin/krnlc --check -p krnl -p krnlc-tests -p compute-benches -v
  lint:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          path: krnl
      - uses: actions/checkout@v4
        with:
          repository: jlogan03/rust-gpu
          ref: jlogan/consistent-floats
          path: rust-gpu
      - name: install toolchains
        run: |
          rustup set profile minimal
          rustup toolchain install stable --component rustfmt,clippy,rust-docs --no-self-update
          rustup toolchain install nightly 1.95.0 --no-self-update
          rustup toolchain install nightly-2026-05-22 --component rustfmt,clippy,rust-src,rustc-dev,llvm-tools --no-self-update
      - name: fmt
        run: cargo fmt --check
      - name: krnlc fmt
        run: cargo +nightly-2026-05-22 fmt --check --manifest-path krnlc/Cargo.toml
      - name: install cargo-hack
        run: cargo install cargo-hack
      - name: clippy
        env:
          CARGO_ALIAS_CLIPPYALL: clippy --workspace
        run: cargo hack --feature-powerset --skip default clippyall --all-targets -v -- -D warnings -A unexpected_cfgs
      - name: krnlc clippy
        run: cargo +nightly-2026-05-22 clippy --manifest-path krnlc/Cargo.toml -v -- -D warnings
      - name: rustdoc
        run: |
          cargo hack -p krnl -p krnl-macros -p krnl-core --feature-powerset --skip default rustdoc -v -- --D warnings
          cargo +nightly hack -p krnl -p krnl-core  rustdoc --all-features -v -- --cfg doc_cfg --D warnings
      - name: msrv
        env:
          CARGO_RESOLVER_INCOMPATIBLE_RUST_VERSIONS: fallback
        run: |
          cargo generate-lockfile
          cat Cargo.lock
          cargo +1.95.0 check --workspace --features serde --all-targets -v
  deny:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          path: krnl
      - uses: actions/checkout@v4
        with:
          repository: jlogan03/rust-gpu
          ref: jlogan/consistent-floats
          path: rust-gpu
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          manifest-path: "krnl/Cargo.toml"
      - uses: EmbarkStudios/cargo-deny-action@v1
        with:
          manifest-path: "krnl/krnlc/Cargo.toml"
